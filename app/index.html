<title>BIM Execution Plan Builder</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b6b66'/%3E%3Crect x='6' y='7' width='20' height='18' rx='1' fill='none' stroke='%23fff' stroke-width='2'/%3E%3Cpath d='M6 20h20M17 20v5M11 7v13M11 13h15' stroke='%23fff' stroke-width='2'/%3E%3Crect x='19' y='21.5' width='5' height='2' fill='%23f07560'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a drawing-set title block across the top, a sheet index on the left, one sheet (BEP section) open at a time. */
:root {
  --paper: #eef2f1;
  --sheet: #ffffff;
  --ink: #16212a;
  --muted: #56646e;
  --line: #d3dbd9;
  --line-strong: #9fb0ad;
  --accent: #0b6b66;
  --accent-soft: #e0efed;
  --redline: #c2361f;
  --redline-soft: #fbe9e5;
  --ok: #2c7a4d;
  --warn: #9a6a12;
  --display: "IBM Plex Sans Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1418; --sheet: #151d22; --ink: #e2e9ec; --muted: #94a3ab;
    --line: #27333a; --line-strong: #46565e; --accent: #4fb5ab; --accent-soft: #15302e;
    --redline: #f07560; --redline-soft: #3a1d18; --ok: #6cc391; --warn: #e0b45a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1418; --sheet: #151d22; --ink: #e2e9ec; --muted: #94a3ab;
  --line: #27333a; --line-strong: #46565e; --accent: #4fb5ab; --accent-soft: #15302e;
  --redline: #f07560; --redline-soft: #3a1d18; --ok: #6cc391; --warn: #e0b45a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 15px/1.55 var(--body); }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; display: grid; gap: 18px; }

/* Title block */
.titleblock { border: 2px solid var(--ink); background: var(--sheet); display: grid; grid-template-columns: 1.6fr 1fr 1fr 0.7fr; }
.tb-cell { padding: 10px 14px; border-right: 1px solid var(--ink); min-width: 0; }
.tb-cell:last-child { border-right: 0; }
.tb-label { font: 600 10.5px/1.2 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.tb-value { font: 600 17px/1.3 var(--display); text-transform: uppercase; letter-spacing: .02em; margin-top: 4px; overflow-wrap: anywhere; }
.tb-value.big { font-size: 22px; }
.tb-sheet { text-align: center; }
.tb-sheet .tb-value { font: 600 26px/1.1 var(--mono); }
.tb-sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.syncdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; vertical-align: 1px; }
.syncdot.live { background: var(--ok); }
.syncdot.busy { background: var(--warn); }
.syncdot.off { background: var(--redline); }

.banner { border: 1px solid var(--line-strong); background: var(--sheet); padding: 10px 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 14px; }
.banner.alert { border-color: var(--redline); background: var(--redline-soft); }

/* Body */
.layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 18px; align-items: start; }
.index { background: var(--sheet); border: 1px solid var(--line); position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
.index h2 { font: 600 11px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0; padding: 12px 14px 8px; }
.index ol { list-style: none; margin: 0; padding: 0 0 6px; }
.index button { width: 100%; display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: center; text-align: left; background: none; border: 0; border-left: 3px solid transparent; padding: 8px 12px 8px 11px; color: var(--ink); font: 500 14px/1.3 var(--body); cursor: pointer; }
.index button:hover { background: var(--accent-soft); }
.index button[aria-current="step"] { border-left-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.index .code { font: 500 12px/1 var(--mono); color: var(--muted); }
.pip { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--line-strong); }
.pip.partial { border-color: var(--warn); background: linear-gradient(90deg, var(--warn) 50%, transparent 50%); }
.pip.done { border-color: var(--ok); background: var(--ok); }
.progress { padding: 10px 14px 14px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
.bar { height: 6px; background: var(--line); margin-top: 6px; }
.bar > i { display: block; height: 100%; background: var(--accent); }

.sheet { background: var(--sheet); border: 1px solid var(--line); padding: 26px 28px 30px; min-width: 0; display: grid; gap: 22px; align-content: start; }
.sheet-head { display: grid; gap: 6px; border-bottom: 2px solid var(--ink); padding-bottom: 14px; }
.eyebrow { font: 600 11.5px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); display: flex; gap: 10px; flex-wrap: wrap; }
.eyebrow .iso { color: var(--muted); }
.sheet h1 { font: 700 30px/1.1 var(--display); text-transform: uppercase; letter-spacing: .01em; margin: 0; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); max-width: 68ch; }

h3 { font: 600 13px/1.2 var(--display); letter-spacing: .1em; text-transform: uppercase; margin: 0; }
.block { display: grid; gap: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 18px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 18px; }
.field { display: grid; gap: 5px; min-width: 0; }
.field label, .lbl { font: 600 12px/1.2 var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.hint { font-size: 12.5px; color: var(--muted); margin: 0; }
input[type=text], input[type=email], input[type=date], select, textarea {
  width: 100%; font: 400 14.5px/1.4 var(--body); color: var(--ink); background: var(--paper);
  border: 1px solid var(--line-strong); border-radius: 2px; padding: 8px 10px; min-width: 0;
}
textarea { min-height: 76px; resize: vertical; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
input:disabled, select:disabled, textarea:disabled { opacity: .75; cursor: not-allowed; }

.btn { font: 600 13px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; border: 1.5px solid var(--ink); background: var(--sheet); color: var(--ink); padding: 10px 14px; cursor: pointer; border-radius: 2px; }
.btn:hover { background: var(--accent-soft); }
.btn.primary { background: var(--ink); color: var(--sheet); }
.btn.primary:hover { background: var(--accent); border-color: var(--accent); }
.btn.small { padding: 7px 10px; font-size: 11.5px; }
.btn.ghost { border-color: var(--line-strong); }
.btn.danger { border-color: var(--redline); color: var(--redline); }
a.btn { display: inline-block; text-decoration: none; }
.icon-btn { border: 0; background: none; color: var(--muted); cursor: pointer; font: 500 18px/1 var(--body); padding: 6px 8px; }
.icon-btn:hover { color: var(--redline); }
.row-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

.tablewrap { overflow-x: auto; border: 1px solid var(--line); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { font: 600 11.5px/1.2 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-align: left; padding: 8px 10px; border-bottom: 1.5px solid var(--line-strong); background: var(--paper); white-space: nowrap; }
td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
td input, td select { background: var(--sheet); padding: 6px 8px; }
.edit-table td { min-width: 130px; }
.edit-table td.tight { min-width: 0; width: 1%; }
tbody tr:last-child td { border-bottom: 0; }
.mono { font-family: var(--mono); font-size: 13px; }

.uses { display: grid; gap: 10px; }
.use { border: 1px solid var(--line); display: grid; grid-template-columns: auto minmax(0,1fr); gap: 4px 12px; padding: 12px 14px; }
.use.on { border-color: var(--accent); background: var(--accent-soft); }
.use input[type=checkbox] { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--accent); }
.use-name { font-weight: 600; }
.use-meta { font-size: 12.5px; color: var(--muted); }
.use-detail { grid-column: 2; display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; margin-top: 8px; }
.tag { display: inline-block; font: 500 11px/1 var(--mono); padding: 4px 6px; border: 1px solid var(--line-strong); color: var(--muted); margin-left: 6px; vertical-align: 1px; }
a { color: var(--accent); }

.callout { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 12px 14px; display: grid; gap: 6px; font-size: 14px; }
.callout.usace { border-left-color: var(--warn); }
.callout ul { margin: 0; padding-left: 18px; }
.callout p { margin: 0; }

.choice { display: flex; gap: 8px; flex-wrap: wrap; }
.choice label { display: flex; gap: 8px; align-items: flex-start; border: 1px solid var(--line-strong); padding: 9px 12px; cursor: pointer; font-size: 14px; flex: 1 1 200px; }
.choice label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.choice input { accent-color: var(--accent); margin-top: 3px; }
.choice small { display: block; color: var(--muted); font-size: 12.5px; }
.code-ex { font: 500 13px/1 var(--mono); }

.check-ok { color: var(--ok); font-weight: 600; }
.check-bad { color: var(--redline); font-weight: 600; }

.qc-rule { display: grid; grid-template-columns: auto minmax(0, 1fr) 150px 140px; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
.qc-rule:last-child { border-bottom: 0; }
.qc-rule input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--accent); }
.qc-rule .txt { font-size: 14px; }

.nav { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 16px; }

/* Review / document preview */
.doc { border: 1px solid var(--line-strong); padding: 26px 28px; background: var(--sheet); display: grid; gap: 14px; }
.doc h2 { font: 700 22px/1.2 var(--display); text-transform: uppercase; margin: 0; }
.doc h3 { font-size: 15px; margin-top: 10px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.doc p { margin: 0; max-width: 72ch; }
.doc ul { margin: 0; padding-left: 20px; }
.todo { color: var(--redline); background: var(--redline-soft); padding: 1px 5px; font-weight: 600; }
.isotag { font: 500 11.5px/1.4 var(--mono); color: var(--muted); }
.stats { display: flex; gap: 18px; flex-wrap: wrap; font-size: 14px; }
.stats b { font: 600 22px/1 var(--mono); display: block; font-variant-numeric: tabular-nums; }
.aps-summary { display: grid; gap: 10px; }

.confirm { border: 1.5px solid var(--redline); padding: 12px 14px; display: grid; gap: 10px; background: var(--redline-soft); }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); transform: translateX(-50%); background: var(--ink); color: var(--sheet); padding: 10px 16px; font-size: 14px; border-radius: 2px; z-index: 10; max-width: calc(100% - 32px); }

@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0,1fr); }
  .index { position: static; }
  .index ol { display: flex; overflow-x: auto; padding: 0 6px 8px; gap: 2px; }
  .index li { flex: 0 0 auto; }
  .index button { grid-template-columns: auto auto auto; border-left: 0; border-bottom: 3px solid transparent; padding: 8px 10px; white-space: nowrap; }
  .index button[aria-current="step"] { border-bottom-color: var(--accent); }
  .titleblock { grid-template-columns: 1fr 1fr; }
  .tb-cell:nth-child(2) { border-right: 0; }
  .tb-cell:nth-child(-n+2) { border-bottom: 1px solid var(--ink); }
  .grid2, .grid3, .use-detail { grid-template-columns: minmax(0,1fr); }
  .qc-rule { grid-template-columns: auto minmax(0,1fr); }
  .qc-rule select, .qc-rule input[type=text] { grid-column: 2; }
  .sheet { padding: 20px 16px 24px; }
  .doc { padding: 18px 16px; }
}
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: rise .18s ease-out; }
  @keyframes rise { from { transform: translateY(4px); } to { transform: none; } }
}
</style>

<div class="wrap">
  <header class="titleblock" aria-label="Plan title block">
    <div class="tb-cell"><div class="tb-label">Project</div><div class="tb-value big" id="tb-project">Untitled project</div><div class="tb-sub" id="tb-owner">BIM Execution Plan</div></div>
    <div class="tb-cell"><div class="tb-label">Governing criteria</div><div class="tb-value" id="tb-agency">NCS V7</div><div class="tb-sub" id="tb-flags"></div></div>
    <div class="tb-cell"><div class="tb-label">Status</div><div class="tb-value" id="tb-status"><span class="syncdot"></span>Connecting</div><div class="tb-sub" id="tb-edited">&nbsp;</div></div>
    <div class="tb-cell tb-sheet"><div class="tb-label">Section</div><div class="tb-value" id="tb-sheet">01</div><div class="tb-sub" id="tb-sheetname">Project</div></div>
  </header>

  <div id="banner" hidden></div>

  <div class="layout">
    <nav class="index" aria-label="Plan sections">
      <h2>Sheet index</h2>
      <ol id="index"></ol>
      <div class="progress"><span id="progress-text">0 of 11 sections complete</span><div class="bar"><i id="progress-bar" style="width:0%"></i></div></div>
    </nav>
    <main class="sheet" id="sheet" aria-live="polite"></main>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- Reference data (from the national-cad-standard and whole-building-design-guide skills) ---------- */
const HELP = {
  layers: "https://help.autodesk.com/view/RVT/2027/ENU/?guid=GUID-3541F82B-9E25-47C5-BE52-3F6C6F40DA02",
  coords: "https://help.autodesk.com/view/RVT/2027/ENU/?guid=GUID-B82147D6-7EAB-48AB-B0C3-3B160E2DCD17",
  ifc: "https://help.autodesk.com/view/RVT/2026/ENU/?guid=GUID-E029E3AD-1639-4446-A935-C9796BC34C95",
  cobie: "https://help.autodesk.com/view/RVT/2027/ENU/?guid=GUID-3ACFF70F-D513-44A1-8579-A226A8530FB9",
  clash: "https://www.autodesk.com/support/technical/article/caas/sfdcarticles/sfdcarticles/How-to-create-a-reusable-Clash-Detective-template-in-Navisworks-Manage-2026.html",
  usace: "https://www.wbdg.org/FFC/AECCAD/ERDC_ITL_SR_23_1_2023.pdf",
  usaceCad: "https://www.wbdg.org/ffc/army-coe/technical-reports-tr/erdcitl-tr19-7",
  gsa: "https://www.gsa.gov/real-estate/facilities-standards-for-the-public-buildings-service",
  ffc: "https://www.wbdg.org/ffc",
  ncs: "https://nibs.org/projects/united-states-national-cad-standard-ncs/",
  psu: "https://psu.pb.unizin.org/bimprojectexecutionplanning/",
  // The team's shared copy: this page published as a Claude artifact, saving to one plan for everyone it's shared with.
  shared: "https://claude.ai/artifact/WnzUc4iPyw4jNjWvkk1Vdy"
};

const STEPS = [
  { id: "project", code: "01", name: "Project", iso: "4.1 · 4.2 · 8.2.2", lede: "Basic facts about the project and which criteria govern it. The owner or agency choice changes what later sections ask for." },
  { id: "team", code: "02", name: "Team", iso: "5.3 · 7.2", lede: "Who holds each role. Every BIM use and quality check later in the plan is assigned to one of these people." },
  { id: "goals", code: "03", name: "Goals", iso: "6.2", lede: "What the owner and team want BIM to achieve on this project, in order of priority. Goals decide which BIM uses are worth their cost." },
  { id: "uses", code: "04", name: "BIM uses", iso: "8.1 · 8.3.2", lede: "Pick the uses that serve your goals. Each selected use needs a responsible party and the reason it earns its place." },
  { id: "process", code: "05", name: "Process", iso: "4.4 · 8.1", lede: "How each selected use flows between parties: who starts it, what they hand over, and who checks it." },
  { id: "exchanges", code: "06", name: "Exchanges", iso: "8.3.3 · 8.3.5 · 8.4.3", lede: "What model content each party delivers, at what level of development (LOD), and when." },
  { id: "collab", code: "07", name: "Collaboration", iso: "7.4 · 7.5.3 · 8.4 · 8.3.6", lede: "Where files live, how often models are shared, how the team meets, and how changes are approved." },
  { id: "tech", code: "08", name: "Technology", iso: "7.1.3 · 7.1.5", lede: "The software and versions each discipline uses, and the file formats they exchange." },
  { id: "standards", code: "09", name: "Standards", iso: "7.5.2 · 8.3.3", lede: "Layer, sheet, and plotting conventions under the U.S. National CAD Standard, plus any agency overrides." },
  { id: "qc", code: "10", name: "Quality control", iso: "8.3.4 · 8.6 · 8.7 · 9.1 · 10.2", lede: "The checks every model passes before it's shared or delivered. The NCS BIM rules are listed for you; keep the ones this project needs." },
  { id: "deliver", code: "11", name: "Deliverables", iso: "8.3.5 · 8.5.2", lede: "The final list of what gets handed over, in which format, and when." },
  { id: "review", code: "R", name: "Review & export", iso: "", lede: "The assembled plan. Anything still missing is marked in red so the team can see what's left." }
];

const AGENCIES = {
  private: "Private / no agency criteria",
  gsa: "GSA",
  usace: "USACE / DoD",
  va: "VA",
  federal: "Other federal agency",
  state: "State or local government"
};

const USES = [
  { id: "existing", name: "Existing conditions modeling", phase: "Planning", desc: "Model the site and building as they stand today, from survey or laser scan." },
  { id: "authoring", name: "Design authoring", phase: "Design", desc: "Each discipline builds its design in the model." },
  { id: "review", name: "Design reviews", phase: "Design", desc: "Owner and stakeholders review the model at set milestones." },
  { id: "coord", name: "3D coordination (clash detection)", phase: "Design, Construction", desc: "Combine discipline models and resolve conflicts before they reach the field.", link: ["Navisworks clash test template", HELP.clash] },
  { id: "drawings", name: "Drawing generation", phase: "Design", desc: "Plans, sections, schedules, and the sheet index come from the model, as NCS recommends." },
  { id: "code", name: "Code validation", phase: "Design", desc: "Use model data to check occupancy, areas, and travel distances." },
  { id: "energy", name: "Energy analysis", phase: "Design", desc: "Test envelope and system options against energy targets." },
  { id: "cost", name: "Cost estimation (5D)", phase: "Design, Construction", desc: "Take quantities from the model for estimates." },
  { id: "4d", name: "Phase planning (4D)", phase: "Construction", desc: "Link the model to the schedule to plan sequencing and logistics." },
  { id: "ifc", name: "Open exchange (IFC)", phase: "All", desc: "Share models with other tools and the owner in the open IFC format.", link: ["Revit IFC export settings", HELP.ifc] },
  { id: "record", name: "Record modeling", phase: "Operations", desc: "Update the model to as-built conditions at closeout." },
  { id: "cobie", name: "Asset management (COBie)", phase: "Operations", desc: "Hand over equipment and space data in COBie format for facility management.", link: ["COBie extension for Revit", HELP.cobie] }
];

const QC_AUTHOR = [
  "Start from the approved template and keep every element in its correct category",
  "Use modeling tools instead of drafting elements by hand",
  "Assign properties and materials to the objects themselves",
  "Host elements on the correct level or host, without large offsets",
  "Let callouts, view references, and titles fill in automatically",
  "Pull schedules, the drawing index, and keynotes from the model",
  "Derive plans, elevations, sections, and details from the model",
  "Don't override dimensions; model real-world sizes after schematic design",
  "Pin or lock items that must not move, such as field-verified conditions"
];
const QC_DELIVER = [
  "All models share one coordinate system",
  "All models share units and unit tolerance",
  "All models share level names and the vertical datum",
  "Purge, clean, and audit each model before sharing",
  "Remove unused views, links, and temporary content; keep links relative",
  "No duplicate or erroneous geometry that would distort quantities",
  "Resolve excess warnings; document any exceptions",
  "Provide one composite model per building",
  "Derive contract documents from the model"
];
const QC_CHECKS = [
  { id: "visual", name: "Visual check", purpose: "No unintended content; design intent is followed" },
  { id: "clash", name: "Interference check", purpose: "Find conflicts between disciplines" },
  { id: "standards", name: "Standards check", purpose: "Layer, sheet, and naming conventions are followed" },
  { id: "integrity", name: "Model integrity check", purpose: "No duplicates, warnings resolved, data complete" }
];
const FREQ = ["", "Before each model share", "Weekly", "At each design milestone", "Before each submission", "At closeout"];

/* ---------- State ---------- */
function blankPlan() {
  const uses = {}; USES.forEach(u => uses[u.id] = { on: false, party: "", value: "", flow: "" });
  const qc = {};
  QC_AUTHOR.forEach((_, i) => qc["a" + i] = { on: true, who: "", freq: "" });
  QC_DELIVER.forEach((_, i) => qc["d" + i] = { on: true, who: "", freq: "" });
  const checks = {}; QC_CHECKS.forEach(c => checks[c.id] = { tool: "", who: "", freq: "" });
  return {
    v: 1,
    project: { name: "", owner: "", location: "", delivery: "", agency: "private", phase: "", start: "", cui: "", iso: false },
    team: [{ role: "BIM manager", org: "", name: "", email: "" }],
    goals: [{ goal: "", uses: "" }],
    uses,
    exchanges: [{ what: "", from: "", to: "", content: "", lod: "", due: "" }],

const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function getPath(obj, path) { return path.split(".").reduce((o, k) => (o == null ? o : o[k]), obj); }
function setPath(obj, path, val) {
  const keys = path.split("."); let o = obj;
  for (let i = 0; i < keys.length - 1; i++) o = o[keys[i]];
  o[keys[keys.length - 1]] = val;
}
const filled = v => typeof v === "string" ? v.trim() !== "" : !!v;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2600); }
const dis = () => (canWrite ? "" : " disabled");
/* Offer a file to the viewer: the Claude downloads capability inside an artifact, otherwise
   a plain browser download (GitHub Pages, a local copy). Resolves true once it's handed over;
   rejects with the capability's error (e.g. code "declined") when the viewer says no. */
async function saveFile(filename, data, type) {
  if (downloads) { const r = await downloads.save({ filename, data }); return !!r && r.status === "saved"; }
  const url = URL.createObjectURL(new Blob([data], { type: `${type};charset=utf-8` }));
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.rel = "noopener"; a.style.display = "none";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  return true;
}

function input(path, label, opts = {}) {
  const val = getPath(plan, path) ?? "";
  const id = "f-" + path.replace(/\./g, "-");
  const ph = opts.ph ? ` placeholder="${esc(opts.ph)}"` : "";
  let ctl;
  if (opts.type === "textarea") ctl = `<textarea id="${id}" data-path="${path}"${ph}${dis()}>${esc(val)}</textarea>`;
  else if (opts.options) {
    // Keep a value set elsewhere (CLI, maps workbook) visible even when it isn't one of the choices.
    const options = filled(val) && !opts.options.some(([v]) => v === val) ? [...opts.options, [val, val]] : opts.options;
    ctl = `<select id="${id}" data-path="${path}"${dis()}>${options.map(([v, l]) => `<option value="${esc(v)}"${v === val ? " selected" : ""}>${esc(l)}</option>`).join("")}</select>`;
  }
  else ctl = `<input id="${id}" type="${opts.type || "text"}" data-path="${path}" value="${esc(val)}"${ph}${dis()}>`;
  if (!label) return ctl;
  return `<div class="field"><label for="${id}">${esc(label)}</label>${ctl}${opts.hint ? `<p class="hint">${opts.hint}</p>` : ""}</div>`;
}
function editTable(listPath, cols, addLabel) {
  const rows = getPath(plan, listPath);
  const body = rows.map((r, i) => `<tr>${cols.map(c => `<td>${input(`${listPath}.${i}.${c.key}`, "", { ph: c.ph, options: c.options })}</td>`).join("")}<td class="tight">${canWrite ? `<button class="icon-btn" data-action="remove" data-list="${listPath}" data-index="${i}" aria-label="Remove row ${i + 1}">×</button>` : ""}</td></tr>`).join("");
  return `<div class="tablewrap"><table class="edit-table"><thead><tr>${cols.map(c => `<th>${esc(c.label)}</th>`).join("")}<th></th></tr></thead><tbody>${body || `<tr><td colspan="${cols.length + 1}" class="hint">No rows yet.</td></tr>`}</tbody></table></div>
  ${canWrite ? `<div class="row-actions"><button class="btn small ghost" data-action="add" data-list="${listPath}">+ ${esc(addLabel)}</button></div>` : ""}`;
}
function teamOptions() {
  const names = plan.team.map(t => t.role + (t.name ? ` (${t.name})` : "")).filter(s => s.trim());
  return [["", "Choose…"], ...names.map(n => [n, n])];
}
const agencyIsUsace = () => plan.project.agency === "usace";

/* ---------- Completion ---------- */
function status(id) {
  const p = plan;
  const ratio = (arr) => { const f = arr.filter(Boolean).length; return f === 0 ? "empty" : f === arr.length ? "done" : "partial"; };
  switch (id) {
    case "project": return ratio([p.project.name, p.project.owner, p.project.location, p.project.delivery, p.project.phase].map(filled));
    case "team": return p.team.some(t => filled(t.role) && filled(t.name)) ? (p.team.every(t => filled(t.name)) ? "done" : "partial") : "empty";
    case "goals": return p.goals.some(g => filled(g.goal)) ? "done" : "empty";
    case "uses": { const on = USES.filter(u => p.uses[u.id].on); return on.length === 0 ? "empty" : on.every(u => filled(p.uses[u.id].party)) ? "done" : "partial"; }
    case "process": { const on = USES.filter(u => p.uses[u.id].on); if (!on.length) return "empty"; return ratio(on.map(u => filled(p.uses[u.id].flow))); }
    case "exchanges": return p.exchanges.some(e => filled(e.what)) ? (p.exchanges.every(e => filled(e.what) && filled(e.lod) && filled(e.due)) ? "done" : "partial") : "empty";
    case "collab": return ratio(["cde", "sharing", "meetings", "coords", "naming", "changes"].map(k => filled(p.collab[k])));
    case "tech": return p.tech.some(t => filled(t.software)) ? (p.tech.every(t => filled(t.software) && filled(t.version)) ? "done" : "partial") : "empty";
    case "standards": return ratio([filled(p.standards.ncs), filled(p.standards.plotting), !agencyIsUsace() || filled(p.project.cui), !(p.standards.iso13567 && p.standards.statusField === "both")]);
    case "qc": { const ch = QC_CHECKS.map(c => filled(p.checks[c.id].who) && filled(p.checks[c.id].freq)); return ratio(ch); }
    case "deliver": return p.deliver.some(d => filled(d.item)) ? (p.deliver.every(d => filled(d.item) && filled(d.due)) ? "done" : "partial") : "empty";
    default: return "empty";
  }
}

/* ---------- NCS name checker (port of check_names.py) ---------- */
const DISC = new Set("GHVBCLSAIQFPDMEWTRXZO".split(""));
const STATUS = new Set("ADEFMNTX123456789".split(""));
const CODE = /^[A-Z0-9~]{4}$/;
const SHEET = /^(?:([A-Z])[-_]|([A-Z]{2}))([0-9])([0-9]{2})(?:-([A-Z0-9]{1,3}))?$/;
function checkLayer(n, sf = "both") {
  if (/[ _]/.test(n)) return ["separate fields with hyphens, not underscores or spaces"];
  const pr = []; if (n !== n.toUpperCase()) pr.push("use uppercase only");
  const f = n.toUpperCase().split("-"), d = f[0], rest = f.slice(1);
  if (d.length < 1 || d.length > 2 || !DISC.has(d[0]) || !/^[A-Z]+$/.test(d)) pr.push(`'${d}' is not a known discipline designator`);
  if (!rest.length) return [...pr, "missing the 4-character major group"];
  if (rest.length > 1 && rest[rest.length - 1].length === 1) {
    const st = rest.pop();
    if (!STATUS.has(st)) pr.push(`'${st}' is not a valid status code`);
    else if (sf === "none") pr.push(`this project doesn't use a status field; remove '-${st}'`);
    else if (sf === "status" && PHASES.has(st)) pr.push(`'${st}' is a phase number; this project uses status letters`);
    else if (sf === "phase" && LETTERS.has(st)) pr.push(`'${st}' is a status letter; this project uses phase numbers`);
  }
  const [maj, ...min] = rest;
  if (!CODE.test(maj)) pr.push(`major group '${maj}' must be exactly 4 letters, digits or ~`);
  if (min.length > 2) pr.push("no more than two minor groups are allowed");
  min.forEach(m => { if (!CODE.test(m)) pr.push(`minor group '${m}' must be exactly 4 letters, digits or ~`); });
  return pr;
}
function checkSheet(n) {
  const u = n.toUpperCase(), m = u.match(SHEET);
  if (!m) {
    if (/^[A-Z][0-9]{3}/.test(u)) return ["a 1-letter discipline needs a hyphen (e.g. S-501)"];
    if (/^[A-Z]{2}-[0-9]/.test(u)) return ["a 2-letter discipline takes no hyphen (e.g. AD101)"];
    if (/^[A-Z]{1,2}-?[0-9]{4,}/.test(u)) return ["sequence number must be exactly 2 digits (01–99)"];
    return ["doesn't match the 5-character sheet format (A-101 or AD101)"];
  }
  const pr = [], letter = m[1] || m[2][0];
  if (n !== u) pr.push("use uppercase only");
  if (!DISC.has(letter)) pr.push(`'${letter}' is not a known discipline designator`);
  if (m[4] === "00") pr.push("sequence 00 isn't permitted; start at 01");
  return pr;
}

    catch (e) { throw new Error(`Invalid JSON on line ${i + 1}.`); }
    if (!row || typeof row !== "object" || Array.isArray(row)) throw new Error(`Expected an object on line ${i + 1}.`);
    rows.push(row);
  });

}

  const changes = hasDiffs ? `<p><b>Diff rows:</b> ${Object.entries(report.changes).filter(([, n]) => n).map(([kind, n]) => `${esc(kind.replace("OBJECT_", "").toLowerCase())}: ${n}`).join(" · ")}</p>` : "";

  const table = report.properties.length ? `<div class="tablewrap"><table><thead><tr><th>Property</th><th>Field ID</th><th>Objects with value</th><th>Coverage</th></tr></thead><tbody>${report.properties.map(p => `<tr><td>${esc(p.name)}</td><td class="mono">${esc(p.id)}</td><td>${p.count} / ${report.propertyRows}</td><td>${p.coverage}%</td></tr>`).join("")}</tbody></table></div>` : report.aggregates.length ? "" : `<p class="hint">No object property values were present in these result rows.</p>`;

  ["#aps-results-file", "#aps-fields-file"].forEach(sel => { const el = $(sel); if (el) el.value = ""; });
  const status = $("#aps-import-status"), output = $("#aps-report");
  if (status) status.textContent = "No APS data imported.";
  if (output) output.innerHTML = "";
}
function runChecker() {
  const names = ($("#checker-input").value || "").split(/[\s,]+/).filter(Boolean).slice(0, 300);
  const out = $("#checker-out");
  if (!names.length) { out.innerHTML = `<p class="hint">Paste at least one name first.</p>`; return; }
  const iso = plan.standards.iso13567, prof = profileFor(), sf = plan.standards.statusField;
  const rows = names.map(n => { const sheet = /^[A-Za-z]{1,2}[-_]?\d/.test(n); const pr = sheet ? checkSheet(n) : iso ? isoCheck(n, prof) : checkLayer(n, sf); return `<tr><td class="mono">${esc(n)}</td><td>${sheet ? "Sheet" : "Layer"}</td><td class="${pr.length ? "check-bad" : "check-ok"}">${pr.length ? "Fix" : "OK"}</td><td>${esc(pr.join("; ") || "—")}</td></tr>`; }).join("");
  out.innerHTML = `<div class="tablewrap"><table><thead><tr><th>Name</th><th>Type</th><th>Result</th><th>Problem</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

/* ---------- Render ---------- */
function renderIndex() {
  $("#index").innerHTML = STEPS.map(s => {
    const st = s.id === "review" ? "" : status(s.id);
    return `<li><button data-goto="${s.id}"${s.id === current ? ' aria-current="step"' : ""}><span class="code">${s.code}</span><span>${s.name}</span>${s.id === "review" ? "<span></span>" : `<span class="pip ${st}" aria-label="${st === "done" ? "complete" : st === "partial" ? "in progress" : "not started"}"></span>`}</button></li>`;
  }).join("");
  const done = STEPS.filter(s => s.id !== "review" && status(s.id) === "done").length;
  $("#progress-text").textContent = `${done} of 11 sections complete`;
  $("#progress-bar").style.width = Math.round(done / 11 * 100) + "%";
}
function renderTitle() {
  const p = plan.project, step = STEPS.find(s => s.id === current);
  $("#tb-project").textContent = p.name || "Untitled project";
  $("#tb-owner").textContent = [p.owner, p.location].filter(Boolean).join(" · ") || "BIM Execution Plan";
  $("#tb-agency").textContent = `NCS ${plan.standards.ncs.split(" ")[0]}` + (p.agency !== "private" ? ` + ${AGENCIES[p.agency]}` : "");
  $("#tb-flags").textContent = [p.iso ? "ISO 9001 aligned" : "", p.cui === "yes" ? "CUI" : "", plan.cobie ? "COBie handover" : ""].filter(Boolean).join(" · ") || " ";
  $("#tb-sheet").textContent = step.code;
  $("#tb-sheetname").textContent = step.name;
}
function renderStatus() {
  const map = { connecting: ["busy", "Connecting"], shared: ["live", "Shared plan"], local: ["off", "This browser only"], readonly: ["live", "View only"] };
  let [cls, txt] = map[mode];
  if (mode === "shared" && (saving || saveTimer)) { cls = "busy"; txt = "Saving…"; }
  $("#tb-status").innerHTML = `<span class="syncdot ${cls}"></span>${txt}`;
  renderEdited();
}
async function renderEdited() {
  const el = $("#tb-edited");
  if (!meta.updatedAt) { el.textContent = mode === "local" ? "Changes stay on this device" : " "; return; }
  let who = "Someone";
  if (meta.updatedBy && userCap) { try { const ps = await userCap.profiles([meta.updatedBy]); who = meta.updatedBy === myId ? "You" : (ps[meta.updatedBy]?.name || "A teammate"); } catch (e) {} }
  else if (meta.updatedBy && meta.updatedBy === myId) who = "You";
  el.textContent = `Edited by ${who}, ${new Date(meta.updatedAt).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })}`;
}
function renderBanner() {
  const b = $("#banner");
  if (pendingRemote) { b.className = "banner"; b.innerHTML = `<span>A teammate updated the plan while you were typing.</span><button class="btn small" data-action="load-remote">Load their changes</button>`; b.hidden = false; return; }
  if (mode === "local") { b.className = "banner alert"; b.innerHTML = `<span>Shared saving isn't available here, so this plan is saved in this browser only. Export it from Review &amp; export to keep a copy.</span><a class="btn small" href="${HELP.shared}" target="_blank" rel="noopener">Open the shared team plan</a>`; b.hidden = false; return; }
  if (mode === "readonly") { b.className = "banner"; b.innerHTML = `<span>You can view this plan. Ask the owner for edit access to make changes.</span>`; b.hidden = false; return; }
  b.hidden = true;
}
function renderSheet() {
  const step = STEPS.find(s => s.id === current);
  const i = STEPS.indexOf(step), prev = STEPS[i - 1], next = STEPS[i + 1];
  const isoTag = plan.project.iso && step.iso ? `<span class="iso">ISO 9001 · ${step.iso}</span>` : "";
  $("#sheet").innerHTML = `
    <div class="sheet-head"><div class="eyebrow"><span>Section ${step.code}</span>${isoTag}</div><h1>${step.name}</h1><p class="lede">${step.lede}</p></div>
    ${R[step.id]()}
    <div class="nav">${prev ? `<button class="btn ghost" data-goto="${prev.id}">← ${prev.code} ${prev.name}</button>` : "<span></span>"}${next ? `<button class="btn primary" data-goto="${next.id}">${next.code} ${next.name} →</button>` : ""}</div>`;
}
function renderAll() { renderIndex(); renderTitle(); renderSheet(); renderStatus(); renderBanner(); }
function renderLight() { renderIndex(); renderTitle(); renderStatus(); }

/* ---------- Saving ---------- */
const LS_KEY = "bep-builder-plan";
// Row templates for the editable lists (port of ROW_TEMPLATES in bep.py).
const ROW_TEMPLATES = {
  team: { role: "", org: "", name: "", email: "" },
  goals: { goal: "", uses: "" },
  exchanges: { what: "", from: "", to: "", content: "", lod: "", due: "", feeds: "" },
  tech: { discipline: "", software: "", version: "", formats: "" },
  deliver: { item: "", format: "", due: "" },
  "standards.codes": { code: "", meaning: "" }
};
// Port of normalize() in bep.py: fill missing keys from the blank plan, repair a section
// damaged into a scalar, and fill every list row from its template (null fields count as missing).
function normalize(p) {
  const isObj = v => v !== null && typeof v === "object" && !Array.isArray(v);
  if (isObj(p) && isObj(p.standards) && !("statusField" in p.standards) && p.standards.status === false) p.standards.statusField = "none";
  const merge = (b, x) => {
    if (x == null) return b;
    if (!isObj(b)) return x;
    if (!isObj(x)) return b;
    const o = { ...b };
    for (const k of Object.keys(x)) o[k] = Object.hasOwn(b, k) ? merge(b[k], x[k]) : x[k];
    return o;
  };
  const out = merge(blankPlan(), isObj(p) ? p : {});
  for (const [path, tmpl] of Object.entries(ROW_TEMPLATES)) {
    const keys = path.split("."), key = keys.pop(), parent = keys.reduce((o, k) => o[k], out);
    const rows = parent[key];
    parent[key] = !Array.isArray(rows) ? JSON.parse(JSON.stringify(getPath(blankPlan(), path)))
      : rows.map(r => isObj(r) ? { ...tmpl, ...Object.fromEntries(Object.entries(r).filter(([, v]) => v != null)) } : { ...tmpl });
  }
  return out;
}
/* Shared saving writes only what changed, so two people editing different fields don't
   overwrite each other. The db's update() merges nested objects but replaces arrays, so an
   edit inside a list row (team.2.name) saves that whole list; any other edit saves one field. */
const clone = v => (v === undefined ? v : JSON.parse(JSON.stringify(v)));
function patchRoot(path) {
  const keys = path.split("."), i = keys.findIndex(k => /^\d+$/.test(k));
  return (i === -1 ? keys : keys.slice(0, i)).join(".");
}
function setPathCreate(obj, path, val) {
  const keys = path.split("."); let o = obj;
  for (let i = 0; i < keys.length - 1; i++) o = (o[keys[i]] ??= {});
  o[keys[keys.length - 1]] = val;
}
function buildPatch(p, paths) {
  const out = {};
  // standards.status is derived from standards.statusField; send it only with that field,
  // so an unrelated edit from a browser that hasn't caught up can't reset a teammate's choice.
  const all = paths.includes("standards.statusField") ? [...paths, "standards.status"] : paths;
  all.forEach(path => setPathCreate(out, path, clone(getPath(p, path))));
  return out;
}
// The latest shared plan with this browser's not-yet-saved edits laid back on top.
function overlayEdits(base, local, paths) {
  const out = clone(base);
  paths.forEach(path => { const v = getPath(local, path); if (v !== undefined) setPathCreate(out, path, clone(v)); });
  return out;
}
// Browser-only saving: keep the whole plan in this browser and drop pending shared writes.
function saveLocal() {
  dirty.clear(); fullSave = false;
  try { localStorage.setItem(LS_KEY, JSON.stringify(plan)); } catch (e) {}
}
// Switch to browser-only saving (shared store gone): save here and drop any teammate
// version waiting behind the banner, since it can no longer be loaded and kept.
function goLocal() {
  mode = "local"; pendingRemote = false; latestRemote = null;
  saveLocal(); renderAll();
}
// How long to wait before retrying a store error, or null when retrying can't succeed.
// Per the db contract: resource_exhausted means slow down, and unknown codes count as unavailable.
const PERMANENT = new Set(["invalid_argument", "quota_exceeded", "revoked", "not_granted",
  "capability_disabled", "capability_removed", "transform_error"]);
function retryDelay(code) {
  if (PERMANENT.has(code)) return null;
  return code === "resource_exhausted" ? 8000 + Math.random() * 4000 : 1500 + Math.random() * 1000;
}
function scheduleSave(path) {
  lastLocalEdit = Date.now();
  if (path) dirty.add(patchRoot(path)); else fullSave = true;   // no path: the whole plan changed (example, reset)
  if (mode === "local") { saveLocal(); return; }
  if (mode !== "shared") return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, Math.max(900, retryAfter - Date.now()));   // new edits don't cut a backoff short
  renderStatus();
}
async function flush() {
  saveTimer = null;
  if (mode === "local") { saveLocal(); renderStatus(); return; }   // shared store dropped out; a retry lands here
  if (saving) { saveQueued = true; return; }
  if (!fullSave && !dirty.size) { renderStatus(); return; }
  saving = true; renderStatus();
  if (docExists === null || (!docExists && !fullSave)) {
    // Saving before the first snapshot arrived (slow connection), or about to create a plan
    // that looked missing: read it now, so an existing shared plan is loaded here and gets a
    // merge rather than a whole-plan overwrite from this browser.
    let snap;
    try { snap = await planRef.get(); }
    catch (e) {
      saving = false;
      const wait = retryDelay(e && e.code);
      if (wait != null) { retryAfter = Date.now() + wait; saveTimer = setTimeout(flush, wait); }   // transient or over budget: retry
      else goLocal();                                          // permanent: stop retrying, keep edits here
      renderStatus(); return;
    }
    if (mode === "local") { saving = false; saveLocal(); renderStatus(); return; }   // store dropped out while checking
    docExists = snap.exists;
    if (snap.exists && !hydrated) applyRemote(snap.data());   // show the shared plan, with this browser's edits on top
  }
  plan.standards.status = plan.standards.statusField !== "none";
  const paths = [...dirty], full = fullSave || !docExists;
  dirty.clear(); fullSave = false;
  inFlight = paths; inFlightFull = full;
  const restore = () => { paths.forEach(x => dirty.add(x)); if (full) fullSave = true; };
  const stamp = { updatedBy: myId, updatedAt: new Date().toISOString(), clientId };
  try {
    if (full) await planRef.set({ plan: clone(plan), ...stamp });
    else await planRef.update({ plan: buildPatch(plan, paths), ...stamp });
    docExists = true; retryAfter = 0;
    meta = { updatedBy: myId, updatedAt: stamp.updatedAt };
    if (full) { committed = []; committedFull = true; }   // the whole plan is saved; keep it whole until its echo
    else committed = [...new Set([...committed, ...paths])];
    committedAt = stamp.updatedAt;
  } catch (e) {
    const code = e && e.code;
    if (code === "invalid_argument" && !full) { docExists = false; hydrated = false; restore(); saveQueued = true; }   // update needs the doc; it was deleted, so write it whole
    else if (code === "invalid_argument") { canWrite = false; mode = "readonly"; renderAll(); toast("This plan is view-only for you, so changes weren't saved."); }
    else if (code === "quota_exceeded") { restore(); toast("The plan is too large to save. Remove some rows and try again."); }
    else if (retryDelay(code) != null) {
      restore(); saveQueued = false;   // queued edits wait for the backoff too, rather than retrying at once
      const wait = retryDelay(code); retryAfter = Date.now() + wait;
      clearTimeout(saveTimer); saveTimer = setTimeout(flush, wait);
    }
    else goLocal();
  }
  saving = false; inFlight = []; inFlightFull = false;
  if (saveQueued) { saveQueued = false; await flush(); }
  renderStatus();
}
// Leave "connecting": edits made while connecting were recorded but not saved, so save them now.
function finishConnecting() {
  mode = canWrite ? "shared" : "readonly";
  if (mode === "shared" && (dirty.size || fullSave) && !saveTimer && !saving) saveTimer = setTimeout(flush, 900);
}
function applyRemote(d) {
  if (fullSave || inFlightFull || committedFull) {
    // A whole-plan change (Load example, Clear plan) is still waiting to save, or saving now,
    // and will replace the shared plan anyway, so keep it rather than the teammate's version.
    meta = { updatedBy: d.updatedBy, updatedAt: d.updatedAt };
    pendingRemote = false;
    renderAll();
    return;
  }
  // Keep edits not yet saved, edits being saved, and saved edits whose echo hasn't arrived.
  // A read-only viewer has none to keep.
  const keep = canWrite ? [...dirty, ...inFlight, ...committed] : [];
  plan = normalize(overlayEdits(normalize(d.plan), plan, keep));
  hydrated = true;
  meta = { updatedBy: d.updatedBy, updatedAt: d.updatedAt };
  pendingRemote = false;
  renderAll();
}
function onRemote(snap) {
  if (mode === "local") return;   // browser-only saving: the shared plan no longer applies here
  if (!snap.exists) {
    // The shared plan was deleted: drop any teammate version waiting behind the banner.
    docExists = false; latestRemote = null; hydrated = false;   // load it again if it's recreated
    if (pendingRemote) { pendingRemote = false; renderBanner(); }
    if (mode === "connecting") { finishConnecting(); renderAll(); }
    return;
  }
  docExists = true;
  const d = snap.data();
  latestRemote = d;
  if (mode === "connecting") finishConnecting();
  const idle = !canWrite || (Date.now() - lastLocalEdit > 4000 && !saveTimer && !saving);   // a viewer has no edits to protect
  if (d.clientId === clientId) {
    if (committedAt && d.updatedAt >= committedAt) { committed = []; committedFull = false; committedAt = null; }   // our last save is in this snapshot
    // Our own save echoing back. It carries the merged shared plan, so a teammate's change
    // that arrived while we were typing can be shown now that we've stopped.
    if ((pendingRemote && idle) || !hydrated) { applyRemote(d); return; }
    meta = { updatedBy: d.updatedBy, updatedAt: d.updatedAt }; renderStatus(); return;
  }
  if (idle) applyRemote(d);
  else { pendingRemote = true; renderBanner(); }
}

/* ---------- Events ---------- */
document.addEventListener("input", e => {
  const el = e.target; const path = el.dataset && el.dataset.path; if (!path || !canWrite) return;
  if (el.type === "checkbox" || el.type === "radio" || el.tagName === "SELECT") return;
  setPath(plan, path, el.value); scheduleSave(path); renderLight();
});
document.addEventListener("change", e => {
  // The APS audit reads files in this browser only and never touches the plan, so read-only viewers can use it too.
  if (e.target.id === "aps-results-file" || e.target.id === "aps-fields-file") {
    importApsFile(e.target.files && e.target.files[0], e.target.id === "aps-fields-file" ? "fields" : "results");
    return;
  }
  const el = e.target; const path = el.dataset && el.dataset.path; if (!path || !canWrite) return;
  if (el.type === "checkbox") setPath(plan, path, el.checked);
  else if (el.type === "radio") { if (el.checked) setPath(plan, path, el.value); }
  else if (el.tagName === "SELECT") setPath(plan, path, el.value);
  else return;
  scheduleSave(path);
  const structural = /^uses\.\w+\.on$|^project\.agency$|^project\.iso$|^cobie$|^team\.|^standards\.(iso13567|statusField|layerFormat|level2)$/.test(path);
  if (structural) { const y = window.scrollY; renderAll(); window.scrollTo(0, y); const again = document.getElementById(el.id); if (again) again.focus({ preventScroll: true }); }
  else renderLight();
});
document.addEventListener("click", async e => {
  const g = e.target.closest("[data-goto]");
  if (g) { current = g.dataset.goto; confirmReset = confirmExample = false; renderAll(); $("#sheet").scrollIntoView({ block: "start", behavior: "smooth" }); try { localStorage.setItem("bep-builder-step", current); } catch (x) {} return; }
  const a = e.target.closest("[data-action]"); if (!a) return;
  const act = a.dataset.action;
  if (act === "add" && canWrite) {
    const list = getPath(plan, a.dataset.list);
    const tmpl = ROW_TEMPLATES[a.dataset.list];
    list.push({ ...tmpl }); scheduleSave(a.dataset.list); renderAll();
    const rows = document.querySelectorAll(`[data-path^="${a.dataset.list}.${list.length - 1}."]`); if (rows[0]) rows[0].focus();
  }
  if (act === "remove" && canWrite) { getPath(plan, a.dataset.list).splice(+a.dataset.index, 1); scheduleSave(a.dataset.list); renderAll(); }
  if (act === "clear-aps") clearApsData();
  if (act === "check") runChecker();
  if (act === "convert") runConvert();
  if (act === "copy-map") {
    const t = mapToMermaid(buildMap());
    try { await navigator.clipboard.writeText(t); toast("Process map copied"); }
    catch (x) { toast("Copying isn't allowed here. The map is included in the Markdown export."); }
  }
  if (act === "definition") {
    const t = isoDefinition(profileFor());
    try { await navigator.clipboard.writeText(t); toast("Definition file copied"); }
    catch (x) { $("#convert-out").innerHTML = `<p class="hint">Copying isn't allowed here. Select the text below and copy it.</p><textarea readonly style="min-height:160px">${esc(t)}</textarea>`; $("#convert-out textarea").select(); }
  }
  if (act === "definition-save") {
    const slug = (plan.project.name || "project").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 60) || "project";
    try { if (await saveFile(`${slug}-layer-definition.txt`, isoDefinition(profileFor()), "text/plain")) toast("Saved"); }
    catch (x) { if (x && x.code !== "declined") toast("Saving files isn't available here. Use Copy definition file instead."); }
  }
  if (act === "example") { confirmExample = true; renderSheet(); }
  if (act === "example-no") { confirmExample = false; renderSheet(); }
  if (act === "example-yes") { plan = examplePlan(); confirmExample = false; scheduleSave(); renderAll(); toast("Example project loaded"); }
  if (act === "reset") { confirmReset = true; renderSheet(); }
  if (act === "reset-no") { confirmReset = false; renderSheet(); }
  if (act === "reset-yes") { plan = blankPlan(); confirmReset = false; scheduleSave(); current = "project"; renderAll(); toast("Plan cleared"); }
  if (act === "load-remote" && latestRemote) applyRemote(latestRemote);
  if (act === "copy-md") {
    const md = docToMd(buildDoc());
    try { await navigator.clipboard.writeText(md); toast("Copied as Markdown"); }
    catch (x) { const n = $("#export-note"); n.innerHTML = `Copying isn't allowed here. Select the text below and copy it.<textarea readonly style="margin-top:8px;min-height:160px">${esc(md)}</textarea>`; n.querySelector("textarea").select(); }
  }
  if (act === "save-md" || act === "save-html") {
    const isMd = act === "save-md";
    const slug = (plan.project.name || "bim-execution-plan").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 60) || "bep";
    const data = isMd ? docToMd(buildDoc()) : docToHtml(buildDoc(), true);
    try { if (await saveFile(`${slug}-bep.${isMd ? "md" : "html"}`, data, isMd ? "text/markdown" : "text/html")) toast("Saved"); }
    catch (x) { if (x && x.code === "declined") return; if (x && x.code === "rate_limited") toast("A save prompt is already open."); else toast("Saving files isn't available here. Use Copy as Markdown instead."); }
  }
});

/* ---------- Boot ---------- */
try { const s = localStorage.getItem("bep-builder-step"); if (s && STEPS.some(x => x.id === s)) current = s; } catch (e) {}
renderAll();

(async function boot() {
  const c = window.claude;
  if (!c || !c.use) { useLocal(); return; }
  const [dbNs, userNs, dl] = await Promise.all([c.use("db").catch(() => null), c.use("user").catch(() => null), c.use("downloads").catch(() => null)]);
  downloads = dl; userCap = userNs;
  if (userNs) { try { myId = await userNs.id(); const w = await userNs.can("data.write"); if (w === false) { canWrite = false; dirty.clear(); fullSave = false; lastLocalEdit = 0; } } catch (e) {} }
  if (!dbNs) { useLocal(); return; }
  db = dbNs; planRef = db.doc("bep/plan");
  mode = canWrite ? "connecting" : "readonly";
  planRef.onSnapshot(onRemote, err => { if (err && (err.code === "revoked" || err.code === "unavailable")) goLocal(); });
  setTimeout(() => { if (mode === "connecting") { finishConnecting(); renderAll(); } }, 6000);
})();

function useLocal() {
  mode = "local";
  try { const raw = localStorage.getItem(LS_KEY); if (raw) plan = normalize(JSON.parse(raw)); } catch (e) {}
  renderAll();
}
</script>
