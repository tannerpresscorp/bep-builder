name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install openpyxl defusedxml
      - run: python tests/test_bep.py
      - name: Example plan exports
        run: python skills/bep-builder-cli/scripts/bep.py export examples/example-plan.json -o "${{ runner.temp }}/example.md"
