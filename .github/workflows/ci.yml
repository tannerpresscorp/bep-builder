name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: pip install openpyxl defusedxml "mcp>=2,<3"
      - run: python tests/test_bep.py
      - name: MCP server tests
        run: python tests/test_mcp.py
      - name: MCP team server tests
        run: python tests/test_mcp_team.py
      - name: Example plan exports
        run: python skills/bep-builder-cli/scripts/bep.py export examples/example-plan.json -o "${{ runner.temp }}/example.md"
